version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directories:
      - /backend/api-gateway
      - /backend/game-service
      - /backend/league-service
      - /backend/stats-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]
