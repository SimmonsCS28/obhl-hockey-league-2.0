version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directories:
      - /backend/api-gateway
      - /backend/game-service
      - /backend/league-service
      - /backend/stats-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]
    ignore:
      # jjwt 0.12+ removed the parser API that JwtUtil uses (parserBuilder, setSigningKey,
      # parseClaimsJws, getBody), so the gateway and stats-service stop compiling.
      # PR #38 rewrites that code; upgrade jjwt by hand when it re-lands, then drop this.
      - dependency-name: "io.jsonwebtoken:*"
