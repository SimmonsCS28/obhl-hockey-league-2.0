version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: gradle
    directories:
      - /backend/api-gateway
      - /backend/game-service
      - /backend/league-service
      - /backend/stats-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
